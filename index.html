<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VR Calorie App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>

<body>

<a-scene>

    <!-- Камера -->
    <a-entity camera position="0 1.6 0" look-controls></a-entity>

    <!-- Панел -->
    <a-plane position="0 1.6 -2" width="1.5" height="1" color="#222"></a-plane>

    <!-- Текст -->
    <a-text value="Calorie Calculator"
            position="0 2 -2"
            align="center"
            color="white">
    </a-text>

    <!-- Бутон -->
    <a-box position="0 1.5 -2"
           depth="0.1"
           height="0.2"
           width="0.6"
           color="blue"
           class="clickable"
           id="btn">
    </a-box>

    <a-text value="Calculate"
            position="0 1.5 -1.9"
            align="center"
            color="white">
    </a-text>

    <!-- Контролери -->
    <a-entity laser-controls="hand: right"></a-entity>

</a-scene>

<script>
document.querySelector("#btn").addEventListener("click", () => {
    alert("Работи във VR!");
});
</script>

</body>
</html>
