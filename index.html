<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VR Calorie Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>

<body>

<a-scene>

<a-entity camera position="0 1.6 0" look-controls></a-entity>
<a-entity laser-controls="hand: right"></a-entity>

<a-plane position="0 1.6 -2" width="1.8" height="1.4" color="#111"></a-plane>

<a-text value="Calorie VR Pro" position="0 2.1 -2" align="center" color="white"></a-text>

<!-- VARIABLES -->
<a-text id="weightText" value="Weight: 70" position="-0.6 1.9 -2"></a-text>
<a-text id="heightText" value="Height: 170" position="-0.6 1.7 -2"></a-text>
<a-text id="ageText" value="Age: 25" position="-0.6 1.5 -2"></a-text>

<!-- BUTTONS +/- -->
<a-box id="wPlus" position="0.7 1.9 -2" color="green" depth="0.1" height="0.2" width="0.2"></a-box>
<a-box id="wMinus" position="1 1.9 -2" color="red" depth="0.1" height="0.2" width="0.2"></a-box>

<a-box id="hPlus" position="0.7 1.7 -2" color="green" depth="0.1" height="0.2" width="0.2"></a-box>
<a-box id="hMinus" position="1 1.7 -2" color="red" depth="0.1" height="0.2" width="0.2"></a-box>

<a-box id="aPlus" position="0.7 1.5 -2" color="green" depth="0.1" height="0.2" width="0.2"></a-box>
<a-box id="aMinus" position="1 1.5 -2" color="red" depth="0.1" height="0.2" width="0.2"></a-box>

<!-- GENDER -->
<a-text value="Gender:" position="-0.6 1.3 -2"></a-text>
<a-box id="maleBtn" position="0.3 1.3 -2" color="blue" depth="0.1" height="0.2" width="0.4"></a-box>
<a-text value="Male" position="0.3 1.3 -1.9" align="center"></a-text>

<a-box id="femaleBtn" position="0.8 1.3 -2" color="gray" depth="0.1" height="0.2" width="0.4"></a-box>
<a-text value="Female" position="0.8 1.3 -1.9" align="center"></a-text>

<!-- ACTIVITY -->
<a-text id="activityText" value="Activity: 1.2" position="-0.6 1.1 -2"></a-text>
<a-box id="actBtn" position="0.7 1.1 -2" color="orange" depth="0.1" height="0.2" width="0.6"></a-box>
<a-text value="Change" position="0.7 1.1 -1.9" align="center"></a-text>

<!-- CALCULATE -->
<a-box id="calcBtn" position="0 0.9 -2" color="purple" depth="0.1" height="0.25" width="0.8"></a-box>
<a-text value="CALCULATE" position="0 0.9 -1.9" align="center"></a-text>

<a-text id="resultText" value="Calories: 0" position="0 0.6 -2" align="center" color="yellow"></a-text>

<!-- FOOD -->
<a-text value="Food +200" position="-0.5 0.3 -2"></a-text>
<a-box id="foodBtn" position="0.7 0.3 -2" color="green" depth="0.1" height="0.2" width="0.6"></a-box>
<a-text value="ADD" position="0.7 0.3 -1.9" align="center"></a-text>

<a-text id="foodText" value="Eaten: 0" position="0 0.1 -2" align="center"></a-text>

<!-- PROGRESS BAR -->
<a-plane position="0 -0.1 -2" width="1.2" height="0.1" color="gray"></a-plane>
<a-plane id="bar" position="-0.6 -0.1 -1.99" width="0" height="0.1" color="lime"></a-plane>

</a-scene>

<script>

let weight=70, height=170, age=25;
let gender="Male";
let activity=1.2;
let target=0;
let eaten=0;

function update(){
document.getElementById("weightText").setAttribute("value","Weight: "+weight);
document.getElementById("heightText").setAttribute("value","Height: "+height);
document.getElementById("ageText").setAttribute("value","Age: "+age);
document.getElementById("activityText").setAttribute("value","Activity: "+activity);
}

document.getElementById("wPlus").onclick=()=>{weight++;update();}
document.getElementById("wMinus").onclick=()=>{weight--;update();}

document.getElementById("hPlus").onclick=()=>{height++;update();}
document.getElementById("hMinus").onclick=()=>{height--;update();}

document.getElementById("aPlus").onclick=()=>{age++;update();}
document.getElementById("aMinus").onclick=()=>{age--;update();}

document.getElementById("maleBtn").onclick=()=>{
gender="Male";
document.getElementById("maleBtn").setAttribute("color","blue");
document.getElementById("femaleBtn").setAttribute("color","gray");
}

document.getElementById("femaleBtn").onclick=()=>{
gender="Female";
document.getElementById("femaleBtn").setAttribute("color","pink");
document.getElementById("maleBtn").setAttribute("color","gray");
}

document.getElementById("actBtn").onclick=()=>{
let list=[1.2,1.375,1.55,1.725];
let i=list.indexOf(activity);
activity=list[(i+1)%list.length];
update();
}

document.getElementById("calcBtn").onclick=()=>{
let bmr=(gender==="Male")
?10*weight+6.25*height-5*age+5
:10*weight+6.25*height-5*age-161;

target=bmr*activity;
eaten=0;

document.getElementById("resultText").setAttribute("value","Calories: "+Math.round(target));
document.getElementById("foodText").setAttribute("value","Eaten: 0");
document.getElementById("bar").setAttribute("width",0);
}

document.getElementById("foodBtn").onclick=()=>{
if(target===0){alert("Calculate first!");return;}

eaten+=200;
document.getElementById("foodText").setAttribute("value","Eaten: "+eaten);

let percent=Math.min(eaten/target,1);
document.getElementById("bar").setAttribute("width",1.2*percent);
}

</script>

</body>
</html>
