<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VR Calorie App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>

<body>

<a-scene cursor="rayOrigin: mouse">

<!-- Камера -->
<a-entity camera position="0 1.6 0" look-controls>
    <a-cursor fuse="true" fuse-timeout="800"></a-cursor>
</a-entity>

<!-- Контролер -->
<a-entity laser-controls="hand: right"
          raycaster="objects: .clickable"></a-entity>

<!-- Панел -->
<a-plane position="0 1.6 -2" width="1.6" height="1.2" color="#1a1a1a"></a-plane>

<!-- Заглавие -->
<a-text value="Calorie App"
        position="0 2 -2"
        align="center"
        scale="0.6 0.6 0.6"
        color="white"></a-text>

<!-- WEIGHT -->
<a-text id="weightText" value="Weight: 70"
        position="-0.6 1.8 -2"
        scale="0.4 0.4 0.4"></a-text>

<a-box id="wPlus" class="clickable"
       position="0.4 1.8 -2"
       width="0.15" height="0.15" depth="0.1"
       color="#2ecc71"></a-box>

<a-text value="+"
        position="0.4 1.8 -1.85"
        align="center"
        scale="0.5 0.5 0.5"
        color="white"></a-text>

<a-box id="wMinus" class="clickable"
       position="0.65 1.8 -2"
       width="0.15" height="0.15" depth="0.1"
       color="#e74c3c"></a-box>

<a-text value="-"
        position="0.65 1.8 -1.85"
        align="center"
        scale="0.5 0.5 0.5"
        color="white"></a-text>

<!-- HEIGHT -->
<a-text id="heightText" value="Height: 170"
        position="-0.6 1.6 -2"
        scale="0.4 0.4 0.4"></a-text>

<a-box id="hPlus" class="clickable"
       position="0.4 1.6 -2"
       width="0.15" height="0.15" depth="0.1"
       color="#2ecc71"></a-box>

<a-text value="+"
        position="0.4 1.6 -1.85"
        scale="0.5 0.5 0.5"
        align="center"></a-text>

<a-box id="hMinus" class="clickable"
       position="0.65 1.6 -2"
       width="0.15" height="0.15" depth="0.1"
       color="#e74c3c"></a-box>

<a-text value="-"
        position="0.65 1.6 -1.85"
        scale="0.5 0.5 0.5"
        align="center"></a-text>

<!-- AGE -->
<a-text id="ageText" value="Age: 25"
        position="-0.6 1.4 -2"
        scale="0.4 0.4 0.4"></a-text>

<a-box id="aPlus" class="clickable"
       position="0.4 1.4 -2"
       width="0.15" height="0.15" depth="0.1"
       color="#2ecc71"></a-box>

<a-text value="+"
        position="0.4 1.4 -1.85"
        scale="0.5 0.5 0.5"
        align="center"></a-text>

<a-box id="aMinus" class="clickable"
       position="0.65 1.4 -2"
       width="0.15" height="0.15" depth="0.1"
       color="#e74c3c"></a-box>

<a-text value="-"
        position="0.65 1.4 -1.85"
        scale="0.5 0.5 0.5"
        align="center"></a-text>

<!-- CALCULATE -->
<a-box id="calcBtn" class="clickable"
       position="0 1.1 -2"
       width="0.7"
       height="0.2"
       depth="0.1"
       color="#3498db"></a-box>

<a-text value="CALCULATE"
        position="0 1.1 -1.85"
        align="center"
        scale="0.4 0.4 0.4"></a-text>

<!-- RESULT -->
<a-text id="resultText"
        value="Calories: 0"
        position="0 0.8 -2"
        align="center"
        color="#3498db"
        scale="0.5 0.5 0.5"></a-text>

</a-scene>

<script>

let weight=70, height=170, age=25;

function update(){
document.getElementById("weightText").setAttribute("value","Weight: "+weight);
document.getElementById("heightText").setAttribute("value","Height: "+height);
document.getElementById("ageText").setAttribute("value","Age: "+age);
}

document.getElementById("wPlus").addEventListener("click",()=>{weight++;update();});
document.getElementById("wMinus").addEventListener("click",()=>{weight--;update();});

document.getElementById("hPlus").addEventListener("click",()=>{height++;update();});
document.getElementById("hMinus").addEventListener("click",()=>{height--;update();});

document.getElementById("aPlus").addEventListener("click",()=>{age++;update();});
document.getElementById("aMinus").addEventListener("click",()=>{age--;update();});

document.getElementById("calcBtn").addEventListener("click",()=>{
let calories=10*weight+6.25*height-5*age+5;
document.getElementById("resultText")
.setAttribute("value","Calories: "+Math.round(calories));
});

</script>

</body>
</html>
